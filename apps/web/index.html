<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineae</title>
  <link rel="stylesheet" href="./pages.css">
  <script type="module" src="./editor.mjs"></script>
</head>
<body>
  <header>
    <h1>Lineae</h1>
    <div class="tools" aria-label="编辑工具 / Editing tools">
      <label class="open" data-tool="open"><span data-copy="open">打开 .tex</span><input id="file" type="file" accept=".tex"></label>
      <button id="download" type="button" data-tool="download" data-copy="download" disabled>下载 .tex</button>
      <select id="language" data-tool="language" aria-label="界面语言 / Interface language">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>
  <main>
    <p id="status" role="status" data-copy="intro">请选择一个 UTF-8 .tex 文件。</p>
    <fieldset id="editor" disabled>
      <legend data-copy="editor">编辑正文</legend>
      <label><span data-copy="paragraph">段落</span><select id="paragraph"></select></label>
      <label><span data-copy="text">正文</span><textarea id="text" dir="auto"></textarea></label>

    </fieldset>
  </main>
</body>
</html>
