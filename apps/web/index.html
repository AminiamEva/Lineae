<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineae</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/brand/lineae-icon.svg">
  <link rel="stylesheet" href="./pages.css">
  <script defer src="./vendor/mathlive/mathlive.min.js"></script>
  <script type="module" src="./editor.mjs"></script>
</head>
<body>
  <header>
    <h1 class="brand" aria-label="Lineæ">
      <a class="brand-link" href="https://github.com/AminiamEva/Lineae" target="_blank" rel="noopener noreferrer" aria-label="Lineae on GitHub">
        <img class="brand-wordmark brand-wordmark-light" src="./assets/brand/lineae-wordmark.svg" width="488" height="186" alt="">
        <img class="brand-wordmark brand-wordmark-dark" src="./assets/brand/lineae-wordmark-dark.svg" width="488" height="186" alt="">
      </a>
    </h1>
    <div class="tools" aria-label="编辑工具 / Editing tools">
      <label class="open" data-tool="open"><span data-copy="open">打开 .tex</span><input id="file" type="file" accept=".tex"></label>
      <button id="download" type="button" data-tool="download" data-copy="download" disabled>保存 .tex</button>
      <select id="language" data-tool="language" aria-label="界面语言 / Interface language">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>
  <main>
    <p id="status" role="status" data-copy="intro" hidden></p>
    <nav id="insert" class="tools" aria-label="插入 / Insert"></nav>
    <article id="editor"></article>
  </main>
</body>
</html>
