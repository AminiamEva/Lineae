<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineae</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/brand/lineae-icon.svg">
  <link rel="preload" href="./assets/fonts/latin-modern/lmroman10-regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="./assets/fonts/latin-modern/lmroman10-bold.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="./pages.css">
  <link rel="stylesheet" href="./source-workspace.css">
  <link rel="stylesheet" href="./project.css">
  <script defer src="./vendor/mathlive/mathlive.min.js"></script>
  <script type="module" src="./editor.mjs"></script>
</head>
<body>
  <header>
    <h1 class="brand" aria-label="Lineæ">
      <a class="brand-link" href="https://github.com/AminiamEva/Lineae" target="_blank" rel="noopener noreferrer" aria-label="Lineae on GitHub">
        <img class="brand-wordmark brand-wordmark-light" src="./assets/brand/lineae-wordmark.svg" width="488" height="186" alt="">
        <img class="brand-wordmark brand-wordmark-dark" src="./assets/brand/lineae-wordmark-dark.svg" width="488" height="186" alt="">
      </a>
    </h1>
    <div class="tools" data-zh-title="编辑工具" data-en-title="Editing tools">
      <label class="open" data-tool="open"><span data-copy="open" data-zh="打开 .tex" data-en="Open .tex">打开 .tex</span><input id="file" type="file" accept=".tex"></label>
      <button id="download" type="button" data-tool="download" data-copy="download" data-zh="下载项目 .zip" data-en="Download project .zip" disabled>下载项目 .zip</button>
      <select id="language" data-tool="language" data-zh-title="界面语言" data-en-title="Interface language">
        <option value="zh-CN">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>
  <main>
    <p id="status" role="status" data-copy="intro" hidden></p>
    <nav id="insert" class="tools" data-zh-title="插入" data-en-title="Insert"></nav>
    <article id="editor"></article>
  </main>
</body>
</html>
