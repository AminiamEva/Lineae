[package]
name = "lineae"
version = "0.1.1"
description = "Lineae offline LaTeX editor"
authors = ["Lineae"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lineae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
