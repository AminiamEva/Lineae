name: Deploy Lineae
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6.0.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/latex.test.mjs tests/config.test.mjs tests/keybindings.test.mjs tests/ui/i18n.test.mjs tests/typeset-layout.test.mjs
      - run: node --test tests/bib/*.test.mjs tests/bib/*/*.test.mjs
      - name: Package the formula editor
        run: |
          archive=$(npm pack mathlive@0.108.0 --pack-destination "$RUNNER_TEMP" --silent)
          mkdir -p apps/web/vendor/mathlive
          tar -xzf "$RUNNER_TEMP/$archive" -C apps/web/vendor/mathlive --strip-components=1 \
            package/mathlive.min.js package/fonts
      - name: Install Chromium for headless regression
        run: npx playwright install --only-shell chromium
        timeout-minutes: 5
      - run: node tests/editor.cjs
      - run: node tests/shortcuts-browser.cjs
      - name: Version browser assets
        run: |
          sed -i "s|./source-workspace.css|./source-workspace.css?v=${GITHUB_SHA}|; s|./project.css|./project.css?v=${GITHUB_SHA}|" apps/web/index.html
          sed -i "s|./pages.css|./pages.css?v=${GITHUB_SHA}|; s|./editor.mjs|./editor.mjs?v=${GITHUB_SHA}|" apps/web/index.html
          sed -i "s|\.mjs';|.mjs?v=${GITHUB_SHA}';|" apps/web/editor.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Let the Pages artifact propagate
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the final Pages deployment retry
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry2
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
