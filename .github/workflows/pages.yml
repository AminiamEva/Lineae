name: Deploy Lineae
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/latex.test.mjs tests/config.test.mjs
      - run: node --test tests/bib/*.test.mjs tests/bib/*/*.test.mjs
      - name: Package the formula editor
        run: |
          archive=$(npm pack mathlive@0.108.0 --pack-destination "$RUNNER_TEMP" --silent)
          mkdir -p apps/web/vendor/mathlive
          tar -xzf "$RUNNER_TEMP/$archive" -C apps/web/vendor/mathlive --strip-components=1 \
            package/mathlive.min.js package/fonts
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor.cjs
      - name: Version browser assets
        run: |
          sed -i "s|./pages.css|./pages.css?v=${GITHUB_SHA}|; s|./editor.mjs|./editor.mjs?v=${GITHUB_SHA}|" apps/web/index.html
          sed -i "s|\.mjs';|.mjs?v=${GITHUB_SHA}';|" apps/web/editor.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - id: deployment
        uses: actions/deploy-pages@v4
