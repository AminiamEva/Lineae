name: Desktop release

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a Windows x64 and macOS arm64 preview after checks (no Linux)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package the formula editor for browser tests
        run: |
          npm run vendor:mathlive
      - name: Web and release-policy regressions
        run: |
          node --test tests/latex.test.mjs tests/config.test.mjs tests/keybindings.test.mjs \
            tests/ui/i18n.test.mjs tests/typeset-layout.test.mjs tests/release-policy.test.mjs \
             tests/project-native-bridge.test.mjs
          node --test tests/native-math-baseline.test.mjs
          bash -n apps/desktop/scripts/publish-preview.sh
          node --test tests/bib/*.test.mjs tests/bib/*/*.test.mjs
          npx playwright install --only-shell chromium
          node tests/editor.cjs
          node tests/shortcuts-browser.cjs
          node tests/math-editing-browser.cjs
          node tests/shortcut-priority-browser.cjs

  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Validate application version
        id: version
        run: node apps/desktop/scripts/validate-release.mjs --macos
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: macos-aarch64
      - name: Check runner and install dependencies
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          npm ci --no-audit --no-fund
          npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Build the editor and package offline resources
        run: |
          npm run build
          npm run vendor:mathlive
      - name: Build the ad-hoc signed application and DMG
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
        with:
          projectPath: apps/desktop
          args: --target aarch64-apple-darwin --bundles app,dmg -- --locked
      - name: Verify and package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash apps/desktop/scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lineae-macos-aarch64
          path: artifacts/macos/*
          if-no-files-found: error
  windows:
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: write
    with:
      coordinated: true
    secrets: inherit

  linux:
    if: ${{ !(inputs.publish_preview || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    uses: ./.github/workflows/linux-release.yml

  native:
    if: ${{ inputs.publish_preview || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/native-tex.yml

  preview:
    if: ${{ inputs.publish_preview || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [web, build, windows, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lineae-macos-aarch64
          path: artifacts/macos
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lineae-desktop-${{ github.sha }}
          path: artifacts/windows
      - name: Publish the verified two-device preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
        run: bash apps/desktop/scripts/publish-preview.sh
      - name: Preserve the verified publication bundle
        if: ${{ always() && hashFiles('artifacts/preview/SHA256SUMS') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lineae-verified-preview-${{ github.sha }}
          path: artifacts/preview/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.tag == github.ref_name
    needs: [web, build, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lineae-macos-aarch64
          path: artifacts/macos
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lineae-desktop-${{ github.sha }}
          path: artifacts/windows
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lineae-linux-x86_64
          path: artifacts/linux
      - name: Publish verified desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: bash apps/desktop/scripts/publish-desktop.sh
