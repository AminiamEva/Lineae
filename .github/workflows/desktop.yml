name: Desktop Preview
run-name: ${{ inputs.release_tag && format('Release {0}', inputs.release_tag) || inputs.checks_only && 'Web regression checks' || 'Desktop preview' }}

on:
  pull_request:
  workflow_call:
    inputs:
      coordinated:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      checks_only:
        description: Run web regression checks without desktop packaging
        type: boolean
        default: false
      release_tag:
        description: Publish this version after all checks and packaging (for example v0.2.0)
        type: string
        default: ''
      allow_unsigned:
        description: Explicitly permit publishing unsigned Windows binaries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate application version and release request
        id: release_request
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHECKS_ONLY: ${{ inputs.checks_only || false }}
          # A repository variable is the deliberate policy switch for tag
          # releases; manual runs can still request it per build.
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned || vars.LINEAE_ALLOW_UNSIGNED == 'true' || false }}
          CERTIFICATE_AVAILABLE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: node apps/desktop/scripts/validate-release.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Vendor MathLive
        shell: pwsh
        run: |
          $archive = npm pack mathlive@0.108.0 --pack-destination $env:RUNNER_TEMP --silent
          New-Item -ItemType Directory -Force apps/web/vendor/mathlive | Out-Null
          tar -xzf "$env:RUNNER_TEMP/$archive" -C apps/web/vendor/mathlive --strip-components=1 package/mathlive.min.js package/fonts
      - name: Data tests
        run: node --test tests/*.test.mjs
      - name: UI tests
        run: node --test tests/ui/*.test.mjs
      - name: Bib backend tests
        run: node --test "tests/bib/**/*.test.mjs"
      - name: Install Chromium
        run: npx playwright install --only-shell chromium
      - name: Requested document regressions
        run: node tests/document-request-browser.cjs
      - name: Appendix numbering and source editing
        run: node tests/appendix-browser.cjs
      - name: Book style gallery integration
        run: node tests/book-styles-browser.cjs
      - name: XeLaTeX paragraph reference
        run: node tests/paragraph-layout-browser.cjs
      - name: Wrapfigure alignment
        run: node tests/wrapfigure-layout-browser.cjs
      - name: Table row/column insert keeps scroll
        run: node tests/table-scroll-browser.cjs
      - name: Table toolbar actions keep scroll
        run: node tests/table-toolbar-scroll-browser.cjs
      - name: Table row insert leaves earlier pages intact
        run: node tests/table-reflow-browser.cjs
      - name: Image crop, sizing and wrap centering
        run: node tests/image-toolbar-browser.cjs
      - name: Image grouping and subfigure tabs
        run: node tests/image-grouping-browser.cjs
      - name: Title date metadata
        run: node tests/maketitle-date-browser.cjs
      - name: xeCJK paragraph reference
        run: node tests/xecjk-layout-browser.cjs
      - name: Project separators and shared paper
        run: node tests/project-separator-browser.cjs
      - name: Project source boundaries and marker layout
        run: node tests/project-boundary-browser.cjs
      - name: Project reopen editing and source selection
        run: node tests/project-reopen-browser.cjs
      - name: Project usability and folded includes
        run: node tests/project-usability-browser.cjs
      - name: Upload project screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-ui-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
      - name: Project rendering parity
        run: node tests/project-render-parity-browser.cjs
      - name: Project editing boundary regressions
        run: node tests/project-editing-browser.cjs
      - name: Pagination idempotency across modes
        run: node tests/pagination-idempotency-browser.cjs
      - name: Workspace navigation regressions
        run: node tests/workspace-navigation-browser.cjs
      - name: Continuous project Document regressions
        run: node tests/project-composition-browser.cjs
      - name: File tree interaction regressions
        run: node tests/file-tree-browser.cjs
      - name: Project workspace regressions
        run: node tests/project-browser.cjs
      - name: Browser regressions
        run: node tests/editor.cjs
      - name: Math editing browser regressions
        run: node tests/math-editing-browser.cjs
      - name: Platform shortcuts and YAML native bindings
        run: node tests/shortcuts-browser.cjs
      - name: Fullscreen shortcut priority regressions
        run: node tests/shortcut-priority-browser.cjs
      - name: Project session regressions
        run: node tests/file-tree-sessions.cjs
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.checks_only }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.checks_only }}
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install desktop CLI
        if: ${{ !inputs.checks_only }}
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Stage native test assets
        if: ${{ !inputs.checks_only }}
        run: node apps/desktop/scripts/stage.mjs
      - name: Native project integrity tests
        if: ${{ !inputs.checks_only }}
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Prepare Windows signing certificate
        if: ${{ !inputs.checks_only && steps.release_request.outputs.requested == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          RELEASE_TAG: ${{ steps.release_request.outputs.tag }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned || vars.LINEAE_ALLOW_UNSIGNED == 'true' || false }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            if ($env:RELEASE_TAG -match 'preview' -or $env:ALLOW_UNSIGNED -eq 'true') {
              Write-Host "::notice::Unsigned Windows release explicitly permitted for $env:RELEASE_TAG."
              exit 0
            }
            throw "Formal release $env:RELEASE_TAG requires a signing certificate or an explicit allow_unsigned request."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "lineae-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows packages
        if: ${{ !inputs.checks_only }}
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: npm --prefix apps/desktop run tauri build
      - name: Verify Windows signatures
        env:
          UNSIGNED_RELEASE: ${{ steps.release_request.outputs.unsigned }}
        if: ${{ !inputs.checks_only && steps.release_request.outputs.requested == 'true' }}
        shell: pwsh
        run: |
          $files = @("apps/desktop/src-tauri/target/release/lineae.exe")
          $files += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -ExpandProperty FullName
          if (-not $env:WINDOWS_CERTIFICATE_PATH) {
            if ($env:UNSIGNED_RELEASE -ne 'true') { throw 'Missing required Windows signing certificate' }
            foreach ($file in $files) {
              if ((Get-AuthenticodeSignature -LiteralPath $file).Status -ne 'NotSigned') { throw "Unexpected signature status: $file" }
            }
            Write-Host 'Verified unsigned application and installer; release notes disclose this status.'
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }
          $files = @("apps/desktop/src-tauri/target/release/lineae.exe")
          $files += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            & $signtool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $file" }
          }
      - name: Remove signing certificate
        if: ${{ !inputs.checks_only && (always()) }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_PATH) {
            Remove-Item $env:WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
      - name: Collect desktop artifacts
        if: ${{ !inputs.checks_only }}
        shell: pwsh
        run: |
          $target = "apps/desktop/src-tauri/target/release"
          $out = "artifacts"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem "$target/bundle/nsis/*.exe" | Copy-Item -Destination $out
          Copy-Item "$target/lineae.exe" "$out/Lineae-portable.exe"
          @(
            "Lineae portable"
            ""
            "Run Lineae-portable.exe directly. No installer is required."
            "Windows WebView2 Runtime must be available on the machine."
            "The offline installer already includes WebView2."
          ) | Set-Content "$out/PORTABLE.txt" -Encoding utf8
          Compress-Archive -Path "$out/Lineae-portable.exe","$out/PORTABLE.txt" -DestinationPath "$out/Lineae-portable.zip"
          Remove-Item "$out/Lineae-portable.exe","$out/PORTABLE.txt"
          $sums = Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path $out) 'SHA256SUMS.txt'), $sums, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.checks_only }}
        with:
          name: lineae-desktop-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
      - name: Publish verified release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.coordinated && !inputs.checks_only && steps.release_request.outputs.requested == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAE_RELEASE_TAG: ${{ steps.release_request.outputs.tag }}
        run: ./apps/desktop/scripts/publish-release.ps1
