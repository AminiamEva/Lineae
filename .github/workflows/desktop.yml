name: Desktop Preview

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Vendor MathLive
        shell: pwsh
        run: |
          $archive = npm pack mathlive@0.108.0 --pack-destination $env:RUNNER_TEMP --silent
          New-Item -ItemType Directory -Force apps/web/vendor/mathlive | Out-Null
          tar -xzf "$env:RUNNER_TEMP/$archive" -C apps/web/vendor/mathlive --strip-components=1 package/mathlive.min.js package/fonts
      - name: Data tests
        run: node --test tests/*.test.mjs
      - name: UI tests
        run: node --test tests/ui/*.test.mjs
      - name: Bib backend tests
        run: node --test "tests/bib/**/*.test.mjs"
      - name: Install Chromium
        run: npx playwright install --only-shell chromium
      - name: Browser regressions
        run: node tests/editor.cjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install desktop CLI
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Prepare Windows signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            if ($env:GITHUB_REF_NAME -match 'preview') {
              Write-Host "::notice::Preview build without a signing certificate."
              exit 0
            }
            throw "Formal release $env:GITHUB_REF_NAME requires WINDOWS_CERTIFICATE. Run apps/desktop/scripts/configure-signing.ps1 first."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "lineae-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows packages
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: npm --prefix apps/desktop run tauri build
      - name: Verify Windows signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PATH) { exit 0 }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }
          $files = @("apps/desktop/src-tauri/target/release/lineae.exe")
          $files += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            & $signtool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $file" }
          }
      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_PATH) {
            Remove-Item $env:WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
      - name: Collect desktop artifacts
        shell: pwsh
        run: |
          $target = "apps/desktop/src-tauri/target/release"
          $out = "artifacts"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem "$target/bundle/nsis/*.exe" | Copy-Item -Destination $out
          Copy-Item "$target/lineae.exe" "$out/Lineae-portable.exe"
          @(
            "Lineae portable"
            ""
            "Run Lineae-portable.exe directly. No installer is required."
            "Windows WebView2 Runtime must be available on the machine."
            "The offline installer already includes WebView2."
          ) | Set-Content "$out/PORTABLE.txt" -Encoding utf8
          Compress-Archive -Path "$out/Lineae-portable.exe","$out/PORTABLE.txt" -DestinationPath "$out/Lineae-portable.zip"
          Remove-Item "$out/Lineae-portable.exe","$out/PORTABLE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: lineae-desktop-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $arguments = @($tag, "--title", "Lineae $tag", "--notes", "Windows x64 desktop build for $tag")
            if ($tag -match 'preview') { $arguments += "--prerelease" }
            & gh release create @arguments
          }
          Get-ChildItem artifacts/* | ForEach-Object { gh release upload $tag $_.FullName --clobber }
